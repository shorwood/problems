[package]
name = "problems-derive"
version = "0.1.0"
edition = "2024"
description = "Derive typed problem metadata and formatted public detail."
publish = false

[lib]
proc-macro = true

[dependencies]
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
proc-macro-crate = { workspace = true }

[dev-dependencies]
issues = { package = "problems", path = "../problems", default-features = false }
thiserror = { workspace = true }
serde_json = { workspace = true }
trybuild = "1.0.121"
