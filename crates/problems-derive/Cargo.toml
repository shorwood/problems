[package]
name = "problems-derive"
version = "0.1.0"
edition = "2024"
description = "Derive typed problem metadata and formatted public detail."
publish = false
license.workspace = true
readme = "../../README.md"

[lib]
proc-macro = true

[dependencies]
heck = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }
proc-macro-crate = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
issues = { package = "problems", version = "0.1.0", path = "../problems", default-features = false }
serde_json = { workspace = true }
trybuild = "1.0.121"
