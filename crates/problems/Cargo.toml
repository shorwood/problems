[package]
name = "problems"
version = "0.1.0"
edition = "2024"
description = "Typed HTTP problem declarations with optional RFC 9457 reporting."
publish = ["crates-io"]
license.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = ["derive"]
derive = ["dep:problems-derive"]
axum = ["dep:axum"]
actix-web = ["dep:actix-web"]
rocket = ["dep:rocket"]
poem = ["dep:poem", "dep:tokio"]
salvo = ["dep:salvo"]
warp = ["dep:warp"]
schemars = ["dep:schemars"]
aide = ["axum", "dep:aide", "dep:serde_json", "schemars"]

[dependencies]
tokio = { workspace = true, optional = true, features = ["net"] }
http = { workspace = true }
problems-derive = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }
rocket = { workspace = true, features = ["json"], optional = true }
poem = { workspace = true, optional = true }
salvo = { workspace = true, optional = true }
warp = { workspace = true, optional = true }
aide = { workspace = true, features = ["axum-json"], optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
serde-xml-rs = "0.8.2"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

axum = { workspace = true }
actix-web = { workspace = true, features = ["macros"] }
rocket = { workspace = true, features = ["json"] }
poem = { workspace = true, features = ["server"] }
salvo = { workspace = true, features = ["server", "http1", "test"] }
warp = { workspace = true, features = ["server", "test"] }
tower = { workspace = true, features = ["util"] }

[[example]]
name = "axum"
required-features = ["derive", "axum"]
test = true

[[example]]
name = "actix-web"
required-features = ["derive", "actix-web"]
test = true

[[example]]
name = "rocket"
required-features = ["derive", "rocket"]
test = true

[[example]]
name = "poem"
required-features = ["derive", "poem"]
test = true

[[example]]
name = "salvo"
required-features = ["derive", "salvo"]
test = true

[[example]]
name = "warp"
required-features = ["derive", "warp"]
test = true

[package.metadata.docs.rs]
all-features = true
