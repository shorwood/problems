[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Local development dependencies are omitted from published manifests.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
